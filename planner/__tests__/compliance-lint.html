<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BuildFi v3 — Compliance Linter</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; max-width: 980px; color: #1a1a1a; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 16px; }
  button { padding: 8px 14px; background: #c49a1a; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; margin-right: 8px; }
  button:hover { background: #a88416; }
  .status { padding: 8px 12px; border-radius: 4px; margin: 12px 0; font-size: 13px; }
  .pass { background: #e9f7ec; color: #2a8c46; font-weight: 600; }
  .fail { background: #fbeeee; color: #a43a3a; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
  th { background: #fafafa; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #555; }
  tr.viol td { color: #a43a3a; }
  code { font-family: 'Menlo', monospace; background: #f7f7f7; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>

<h1>v3 Compliance Linter</h1>
<div class="sub">Scans <code>planner_v3.html</code> for AMF-forbidden directive phrasing and disclaimer parity between FR and EN. Blocks commit if any violation is found.</div>

<button onclick="run()">▶ Run linter</button>
<button onclick="downloadReport()" id="dlBtn" disabled>⬇ Download report</button>

<div id="summary" class="status">Idle.</div>

<h3 style="font-size:14px;margin-top:20px">Violations</h3>
<table id="violTable">
  <thead><tr><th>Pattern</th><th>Context (snippet)</th><th>Rule</th></tr></thead>
  <tbody id="violBody"><tr><td colspan="3" style="color:#888;font-style:italic">No scan yet.</td></tr></tbody>
</table>

<h3 style="font-size:14px;margin-top:20px">Disclaimer parity</h3>
<div id="parityOut" style="font-size:12px;color:#555">—</div>

<script>
/* ━━ Forbidden phrasing ━━ */
/* Each rule flags directive language inconsistent with AMF guidance. FR + EN. */
/* Patterns use word-boundary-ish matches; some are broader than strict regex to
   catch near-misses. Adjust as needed. */
const RULES = [
  // French directives
  { re: /\bdevriez\b/gi,                    rule: "FR directive: 'devriez' (you should)" },
  { re: /\bvous\s+devez\b/gi,               rule: "FR directive: 'vous devez' (you must)" },
  { re: /\bnous\s+recommandons\b/gi,        rule: "FR directive: 'nous recommandons' (we recommend)" },
  { re: /\bil\s+faut\b/gi,                  rule: "FR directive: 'il faut' (one must)" },
  { re: /\bje\s+recommande\b/gi,            rule: "FR directive: 'je recommande'" },
  // English directives
  { re: /\byou\s+should\b/gi,               rule: "EN directive: 'you should'" },
  { re: /\byou\s+must\b/gi,                 rule: "EN directive: 'you must'" },
  { re: /\bwe\s+recommend\b/gi,             rule: "EN directive: 'we recommend'" },
  { re: /\bi\s+recommend\b/gi,              rule: "EN directive: 'i recommend'" }
];

/* ━━ Disclaimer parity ━━ */
/* Strings that must exist in BOTH languages in the bundle. If present in FR
   and missing in EN (or vice-versa), flag. */
const DISCLAIMER_PAIRS = [
  { fr: "Outil \u00e9ducatif", en: "Educational tool" },
  { fr: "ne constitue pas un conseil", en: "does not constitute" },
  { fr: "Consultez un professionnel", en: "Consult a qualified professional" }
];

/* ━━ Allowlist ━━ */
/* Some legitimate strings contain trigger words (e.g. "il faut" in a user
   quote or test fixture). Allow these literal substrings to skip. */
const ALLOWLIST = [
  "// PII:", "/*AMF-safe:",
  // Legacy, intentional occurrences documented in commit message:
];

async function fetchPlanner() {
  const resp = await fetch("../planner_v3.html", { cache: "no-store" });
  if (!resp.ok) throw new Error("fetch failed: " + resp.status);
  return await resp.text();
}

function findViolations(src) {
  const violations = [];
  const lines = src.split("\n");
  RULES.forEach(function (r) {
    let m;
    const re = new RegExp(r.re.source, r.re.flags);
    while ((m = re.exec(src)) !== null) {
      // Find which line it's on
      const before = src.slice(0, m.index);
      const line = before.split("\n").length;
      const lineContent = lines[line - 1] || "";
      // Allowlist check
      const skip = ALLOWLIST.some(function (a) { return lineContent.indexOf(a) >= 0; });
      if (skip) continue;
      // Skip matches inside long one-line regexes, array templates, or script comments
      // identified by common non-user-text patterns (heuristic).
      const looksLikeCodeOnly = /^\s*(\/\/|\/\*|\*)/.test(lineContent);
      if (looksLikeCodeOnly) continue;
      violations.push({
        pattern: m[0],
        rule: r.rule,
        line: line,
        snippet: lineContent.trim().slice(0, 160)
      });
    }
  });
  return violations;
}

function checkParity(src) {
  const results = [];
  DISCLAIMER_PAIRS.forEach(function (p) {
    const inFR = src.indexOf(p.fr) >= 0;
    const inEN = src.indexOf(p.en) >= 0;
    results.push({ fr: p.fr, en: p.en, hasFR: inFR, hasEN: inEN, pass: inFR === inEN });
  });
  return results;
}

let lastReport = null;

async function run() {
  document.getElementById("summary").textContent = "Running...";
  document.getElementById("summary").className = "status";
  try {
    const src = await fetchPlanner();
    const viol = findViolations(src);
    const parity = checkParity(src);
    const allParityPass = parity.every(function (r) { return r.pass; });

    const tbody = document.getElementById("violBody");
    if (viol.length === 0) {
      tbody.innerHTML = "<tr><td colspan='3' style='color:#2a8c46;font-weight:600'>✓ No directive phrasing detected.</td></tr>";
    } else {
      tbody.innerHTML = "";
      viol.forEach(function (v) {
        const row = document.createElement("tr");
        row.className = "viol";
        row.innerHTML = "<td><code>" + v.pattern + "</code> @ line " + v.line + "</td>"
          + "<td><code>" + v.snippet.replace(/</g, "&lt;") + "</code></td>"
          + "<td>" + v.rule + "</td>";
        tbody.appendChild(row);
      });
    }

    const pout = document.getElementById("parityOut");
    pout.innerHTML = parity.map(function (p) {
      const status = p.pass
        ? "<span style='color:#2a8c46'>✓</span>"
        : "<span style='color:#a43a3a;font-weight:600'>✗ FR=" + p.hasFR + " EN=" + p.hasEN + "</span>";
      return status + " \"" + p.fr + "\" ↔ \"" + p.en + "\"";
    }).join("<br>");

    const s = document.getElementById("summary");
    if (viol.length === 0 && allParityPass) {
      s.textContent = "✓ Compliance PASS. No violations, disclaimers paired.";
      s.className = "status pass";
    } else {
      s.textContent = "✗ Compliance FAIL: " + viol.length + " directive(s), " + parity.filter(function(r){return !r.pass;}).length + " parity break(s).";
      s.className = "status fail";
    }

    lastReport = {
      generated: new Date().toISOString(),
      target: "planner_v3.html",
      violations: viol, parity: parity,
      pass: viol.length === 0 && allParityPass
    };
    document.getElementById("dlBtn").disabled = false;
  } catch (e) {
    document.getElementById("summary").textContent = "Linter error: " + e.message;
    document.getElementById("summary").className = "status fail";
  }
}

function downloadReport() {
  if (!lastReport) return;
  const blob = new Blob([JSON.stringify(lastReport, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "compliance-report-" + Date.now() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>

</body>
</html>
